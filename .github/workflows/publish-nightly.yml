name: Publish Nightly

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ghcr-publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  publish-nightly:
    name: publish nightly image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d  # v4.2.0
        with:
          version: 2026.6.6
          sha256: b8c25ad5e1c178bb7ba1e0fca9066153f8ef1b28bf5a8456c20a8acd2522e556
          install: false
          cache: true

      - name: Install project tools
        run: mise install

      - name: Compute and apply nightly version
        id: nightly
        shell: bash
        run: |
          set -euo pipefail

          # Read the next-pending release version from Cargo.toml and increment
          # its patch component. The image tag carries the `v` prefix so nightly
          # tags line up with release tags, while Cargo keeps plain SemVer.
          CURRENT=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEXT_PATCH="${MAJOR}.${MINOR}.$((PATCH + 1))"
          DATE=$(date -u +%Y%m%d)
          NIGHTLY_VERSION="${NEXT_PATCH}-nightly.${DATE}.${GITHUB_RUN_NUMBER}"
          cargo set-version --workspace "$NIGHTLY_VERSION"
          echo "version=$NIGHTLY_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NIGHTLY_VERSION"     >> "$GITHUB_OUTPUT"
          echo "Building nightly: v$NIGHTLY_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0
        with:
          platforms: arm64

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.nightly.outputs.tag }}
            type=raw,value=nightly
            type=sha,prefix=sha-,format=short

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
